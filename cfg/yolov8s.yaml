trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 500
  default_root_dir: runs/yolov8s-simota-500
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: runs/yolov8s-simota-500
      name: csv
      version: version_0
  callbacks:
    - class_path: lightning_yolo.coco_datamodule.CloseMosaic
      init_args:
        epochs: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: runs/yolov8s-simota-500/checkpoints
        filename: epoch={epoch:03d}-val_map={val/map:.4f}
        monitor: val/map
        mode: max
        save_last: true
        save_top_k: 3
        auto_insert_metric_name: false
model:
  architecture: yolov8s
  num_classes: 80
  matching_algorithm: simota
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 3.0
  final_lr_multiplier: 0.01
  ema_decay: 0.9999
data:
  data_dir: data
  image_size: [640, 640]
  batch_size: 64
  num_workers: 6
  translate: 0.1
  scale: 0.5
  mixup: 0.0

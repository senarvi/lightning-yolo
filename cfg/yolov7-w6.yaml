trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  accumulate_grad_batches: 4
  max_epochs: 500
  default_root_dir: runs/yolov7-w6
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: runs/yolov7-w6
  log_every_n_steps: 50
  callbacks:
    - class_path: lightning_yolo.coco_datamodule.CloseMosaic
      init_args:
        epochs: 10
    - class_path: lightning_yolo.callbacks.EMAWeightAveraging
      init_args:
        decay: 0.9999
        warmup_updates: 2000.0
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: runs/yolov7-w6/checkpoints
        monitor: val/map
        mode: max
        save_last: true
        save_top_k: 3
        verbose: true
model:
  architecture: yolov7-w6
  num_classes: 80
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 3.0
  final_lr_multiplier: 0.01
  confidence_threshold: 0.001
  nms_threshold: 0.7
  detections_per_image: 300
  matching:
    algorithm: simota
  loss:
    overlap_multiplier: 5.0
    confidence_multiplier: 1.0
    class_multiplier: 1.0
data:
  data_dir: data
  image_size: [640, 640]
  batch_size: 16
  num_workers: 6
  translate: 0.1
  scale: 0.9
  mixup: 0.1
